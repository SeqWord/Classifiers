name: mtb_amr_classifier

# Python-only. Prefer the pip venv in the README.
# FASTQ/BLAST: conda install -c conda-forge -c bioconda bwa samtools bcftools blast
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  - numpy
  - pandas
  - scikit-learn>=1.3,<1.6
  - scipy
  - joblib
  - biopython
  - tqdm
